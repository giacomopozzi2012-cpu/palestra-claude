<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer Pomodoro</title>
  <style>
    :root {
      --bg: #fdf6f0;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #777;
      --accent: #e5533d;
      --accent-dark: #c43f2b;
      --ring-bg: #f1e4dc;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1c1a19;
        --card: #272423;
        --text: #f2ece8;
        --muted: #a59d98;
        --ring-bg: #3a3431;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1c1a19;
      --card: #272423;
      --text: #f2ece8;
      --muted: #a59d98;
      --ring-bg: #3a3431;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .stato { margin: 0 0 24px; color: var(--muted); font-size: 0.95rem; }
    .anello { position: relative; width: 240px; height: 240px; margin: 0 auto 28px; max-width: 100%; }
    .anello svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .anello circle { fill: none; stroke-width: 10; }
    .sfondo { stroke: var(--ring-bg); }
    .progresso { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 0.3s linear; }
    .tempo {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.4rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .pulsanti { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit; font-weight: 600;
      padding: 12px 22px;
      border-radius: 999px;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      min-width: 96px;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
    }
    button.primario { background: var(--accent); color: #fff; }
    button.primario:hover:not(:disabled) { background: var(--accent-dark); border-color: var(--accent-dark); }
    button:not(.primario):hover:not(:disabled) { background: var(--accent); color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button.tema {
      margin-top: 20px;
      padding: 8px 16px;
      min-width: 0;
      font-size: 0.85rem;
      font-weight: 500;
      border: 1px solid var(--muted);
      color: var(--muted);
    }
    button.tema:hover:not(:disabled) { background: transparent; color: var(--text); border-color: var(--text); }

    /* Modalità pausa: colore verde invece del rosso */
    body[data-modo="pausa"] { --accent: #2f9e6e; --accent-dark: #237a55; }

    /* Linguette per scegliere la modalità */
    .modi {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      margin-bottom: 16px;
      border-radius: 999px;
      background: var(--ring-bg);
    }
    button.modo {
      min-width: 0;
      padding: 6px 14px;
      font-size: 0.85rem;
      border: none;
      color: var(--muted);
    }
    button.modo:not(.primario):hover:not(:disabled) { background: transparent; color: var(--text); }
    button.modo[aria-pressed="true"] { background: var(--accent); color: #fff; }
  </style>
  <script>
    // Applica il tema salvato prima del render, per evitare il lampo di colore sbagliato
    try {
      const t = localStorage.getItem('pomodoro-tema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* storage non disponibile */ }
  </script>
</head>
<body>
  <main class="card">
    <div class="modi" role="group" aria-label="Modalità">
      <button class="modo" id="modo-lavoro" aria-pressed="true">🍅 Concentrazione</button>
      <button class="modo" id="modo-pausa" aria-pressed="false">☕ Pausa</button>
    </div>
    <h1 id="titolo">🍅 Pomodoro</h1>
    <p class="stato" id="stato">Pronto per 25 minuti di concentrazione</p>

    <div class="anello">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="sfondo" cx="60" cy="60" r="54"></circle>
        <circle class="progresso" id="progresso" cx="60" cy="60" r="54"></circle>
      </svg>
      <div class="tempo" id="tempo" role="timer" aria-live="off">25:00</div>
    </div>

    <div class="pulsanti">
      <button class="primario" id="avvia">Avvia</button>
      <button id="pausa" disabled>Pausa</button>
      <button id="reset">Reset</button>
    </div>

    <button class="tema" id="tema" aria-label="Cambia tema"></button>
  </main>

  <script>
    // Le due modalità: durata (in millisecondi) e testi da mostrare
    const MODI = {
      lavoro: {
        durata: 25 * 60 * 1000,
        titolo: '🍅 Pomodoro',
        pronto: 'Pronto per 25 minuti di concentrazione',
        inCorso: 'Concentrati!',
        nomeTab: 'Pomodoro'
      },
      pausa: {
        durata: 5 * 60 * 1000,
        titolo: '☕ Pausa',
        pronto: 'Pronto per 5 minuti di pausa',
        inCorso: 'Rilassati, alzati, bevi un po\' d\'acqua',
        nomeTab: 'Pausa'
      }
    };

    const elTempo = document.getElementById('tempo');
    const elStato = document.getElementById('stato');
    const elTitolo = document.getElementById('titolo');
    const elProgresso = document.getElementById('progresso');
    const btnAvvia = document.getElementById('avvia');
    const btnPausa = document.getElementById('pausa');
    const btnReset = document.getElementById('reset');
    const btnModoLavoro = document.getElementById('modo-lavoro');
    const btnModoPausa = document.getElementById('modo-pausa');

    const CIRC = 2 * Math.PI * 54;
    elProgresso.style.strokeDasharray = CIRC;

    let modo = 'lavoro';                // modalità attuale: 'lavoro' o 'pausa'
    let rimanente = MODI[modo].durata;  // ms rimanenti
    let fine = null;                    // timestamp di fine quando in esecuzione
    let intervallo = null;

    function formatta(ms) {
      const sec = Math.ceil(ms / 1000);
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function aggiorna() {
      const testo = formatta(rimanente);
      elTempo.textContent = testo;
      document.title = (fine ? '▶ ' : '') + testo + ' – ' + MODI[modo].nomeTab;
      elProgresso.style.strokeDashoffset = CIRC * (1 - rimanente / MODI[modo].durata);
    }

    function tick() {
      rimanente = Math.max(0, fine - Date.now());
      aggiorna();
      if (rimanente === 0) completato();
    }

    function avvia() {
      if (intervallo || rimanente === 0) return;
      chiediPermessoNotifiche();
      fine = Date.now() + rimanente;
      intervallo = setInterval(tick, 250);
      btnAvvia.disabled = true;
      btnPausa.disabled = false;
      elStato.textContent = MODI[modo].inCorso;
      aggiorna();
    }

    function pausa() {
      if (!intervallo) return;
      clearInterval(intervallo);
      intervallo = null;
      rimanente = Math.max(0, fine - Date.now());
      fine = null;
      btnAvvia.disabled = false;
      btnAvvia.textContent = 'Riprendi';
      btnPausa.disabled = true;
      elStato.textContent = 'In pausa';
      aggiorna();
    }

    // Ferma il timer e lo riporta all'inizio della modalità attuale
    function reset() {
      clearInterval(intervallo);
      intervallo = null;
      fine = null;
      rimanente = MODI[modo].durata;
      btnAvvia.disabled = false;
      btnAvvia.textContent = 'Avvia';
      btnPausa.disabled = true;
      elStato.textContent = MODI[modo].pronto;
      aggiorna();
    }

    // Cambia modalità (lavoro <-> pausa) e azzera il timer
    function impostaModo(nuovo) {
      modo = nuovo;
      document.body.dataset.modo = nuovo;
      elTitolo.textContent = MODI[nuovo].titolo;
      btnModoLavoro.setAttribute('aria-pressed', nuovo === 'lavoro');
      btnModoPausa.setAttribute('aria-pressed', nuovo === 'pausa');
      reset();
    }

    function completato() {
      const eraLavoro = modo === 'lavoro';
      suona();
      notifica(eraLavoro);
      // Prepara subito la fase successiva: dopo il lavoro la pausa, dopo la pausa il lavoro
      impostaModo(eraLavoro ? 'pausa' : 'lavoro');
      elStato.textContent = eraLavoro
        ? 'Tempo scaduto! Avvia la pausa da 5 minuti 🎉'
        : 'Pausa finita! Pronto a ripartire?';
      document.title = (eraLavoro ? '✅ Fatto!' : '⏰ Pausa finita') + ' – Pomodoro';
    }

    // --- Notifiche del browser ---
    function chiediPermessoNotifiche() {
      try {
        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission();
        }
      } catch (e) { /* API non disponibile */ }
    }

    function notifica(eraLavoro) {
      try {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const n = new Notification(eraLavoro ? 'Pomodoro completato 🍅' : 'Pausa finita ☕', {
          body: eraLavoro ? 'Tempo scaduto! Fai una pausa di 5 minuti.' : 'Si torna a concentrarsi!',
          tag: 'pomodoro'
        });
        n.onclick = () => { window.focus(); n.close(); };
      } catch (e) { /* alcuni browser mobile non supportano il costruttore */ }
    }

    // --- Tema chiaro/scuro ---
    const btnTema = document.getElementById('tema');
    const mqScuro = window.matchMedia('(prefers-color-scheme: dark)');

    function temaAttivo() {
      const t = document.documentElement.dataset.theme;
      if (t === 'light' || t === 'dark') return t;
      return mqScuro.matches ? 'dark' : 'light';
    }

    function aggiornaPulsanteTema() {
      const scuro = temaAttivo() === 'dark';
      btnTema.textContent = scuro ? '☀️ Tema chiaro' : '🌙 Tema scuro';
      btnTema.setAttribute('aria-label', scuro ? 'Passa al tema chiaro' : 'Passa al tema scuro');
    }

    btnTema.addEventListener('click', () => {
      const nuovo = temaAttivo() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = nuovo;
      try { localStorage.setItem('pomodoro-tema', nuovo); } catch (e) { /* storage non disponibile */ }
      aggiornaPulsanteTema();
    });
    mqScuro.addEventListener('change', aggiornaPulsanteTema);
    aggiornaPulsanteTema();

    function suona() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        [0, 0.4, 0.8].forEach((t) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.25, ctx.currentTime + t);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
          osc.connect(gain).connect(ctx.destination);
          osc.start(ctx.currentTime + t);
          osc.stop(ctx.currentTime + t + 0.3);
        });
      } catch (e) { /* audio non disponibile */ }
    }

    btnAvvia.addEventListener('click', avvia);
    btnPausa.addEventListener('click', pausa);
    btnReset.addEventListener('click', reset);
    btnModoLavoro.addEventListener('click', () => impostaModo('lavoro'));
    btnModoPausa.addEventListener('click', () => impostaModo('pausa'));

    aggiorna();
  </script>
</body>
</html>
